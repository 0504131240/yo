<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>קלינו — הניהול הוא עלינו. הטיפול הוא עליך.</title>
<meta name="description" content="אפליקציית PWA לניהול קליניקה עבור פסיכולוגים, פיזיותרפיסטים, קלינאיות הקשורות ומטפלים — עם בינה מלאכותית מסייעת.">
<style>
  :root {
    --bg1: #0A0B1E;
    --bg2: #13152F;
    --accent: #7C5CFC;
    --accent2: #A78BFA;
    --text: #F0F0FF;
    --sub: #9090BB;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 100%);
    min-height: 100vh;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow: hidden;
    position: relative;
  }
  /* Stars background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 15% 20%, rgba(255,255,255,.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 40% 60%, rgba(255,255,255,.3) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 70% 15%, rgba(255,255,255,.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 85% 75%, rgba(255,255,255,.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 25% 85%, rgba(255,255,255,.2) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 55% 40%, rgba(255,255,255,.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 30%, rgba(255,255,255,.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 10% 55%, rgba(255,255,255,.2) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 90%, rgba(255,255,255,.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 10%, rgba(255,255,255,.4) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }
  .container {
    position: relative;
    z-index: 1;
    max-width: 560px;
    width: 100%;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .pwa-badge {
    background: rgba(124,92,252,.15);
    border: 1px solid rgba(124,92,252,.4);
    color: var(--accent2);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    padding: 5px 16px;
    border-radius: 20px;
    text-transform: uppercase;
  }
  .logo {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent) 0%, #5B3EE8 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    box-shadow: 0 0 40px rgba(124,92,252,.4);
  }
  h1 {
    font-size: clamp(28px, 7vw, 48px);
    font-weight: 700;
    line-height: 1.2;
    color: var(--text);
  }
  h1 .accent {
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle {
    color: var(--sub);
    font-size: clamp(13px, 3.5vw, 16px);
    line-height: 1.7;
    max-width: 440px;
  }
  .cta {
    display: inline-block;
    background: linear-gradient(135deg, var(--accent) 0%, #5B3EE8 100%);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    padding: 14px 36px;
    border-radius: 30px;
    text-decoration: none;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 24px rgba(124,92,252,.4);
    transition: transform .15s, box-shadow .15s;
  }
  .cta:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(124,92,252,.55); }
  .features {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-top: 4px;
  }
  .feature {
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 12px;
    color: var(--sub);
  }
  .footer {
    margin-top: 16px;
    font-size: 11px;
    color: rgba(144,144,187,.5);
  }
</style>
</head>
<body>
<div class="container">
  <div class="pwa-badge">PWA</div>
  <div class="logo">🧠</div>
  <h1>הניהול הוא עלינו.<br><span class="accent">הטיפול הוא עליך.</span></h1>
  <p class="subtitle">
    אפליקציה לניהול קליניקה עבור פסיכולוגים, פיזיותרפיסטים, קלינאיות הקשורות ומטפלים — עם בינה מלאכותית מסייעת, שמחשבת ומסייעת.
  </p>
  <a class="cta" href="../">לגלות את האפליקציה</a>
  <div class="features">
    <span class="feature">📅 ניהול מטופלים</span>
    <span class="feature">💳 תשלומים</span>
    <span class="feature">🤖 בינה מלאכותית</span>
    <span class="feature">📱 PWA</span>
    <span class="feature">☁️ ענן</span>
  </div>
  <div class="footer">klino-app.vercel.app</div>
</div>
</body>
</html>
